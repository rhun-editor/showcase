# Showcase: a tour of everything an extension can do in rhun. Each command shows one part of the
# protocol (docs: https://rhun.app/extensions/v1/); the README lists them.
name = showcase
owner = rhun-editor
title = Showcase
description = A tour of everything an extension can do in rhun: commands, edits, marks, prompts and more.
# the badge in the title bar, the dropdown and the Extensions page: the icon on its color
icon = icon.png
color = #2a9d8f
version = 0.2.0
protocol = 1
run.linux-x86_64 = bin/showcase-linux-x86_64
run.macos-arm64 = bin/showcase-macos-arm64
run.windows-x64 = bin/showcase-windows-x64.exe

[commands]
tour = Showcase Tour | ctrl+alt+t
greet = Insert Greeting
shout = Change Case of Selection
wrap = Wrap Selection in Brackets
stats = Document Statistics
marks = Mark TODO and FIXME
clear = Clear Marks
next = Go to Next TODO
hello = Say Hello to Someone
readme = Open the Project README
terminal = Suggest a Terminal Command
wordwrap = Toggle Word Wrap
indent = Use the Showcase Tab Width
more = Add a Command While Running

[settings]
greeting.title = Greeting
greeting.description = What Insert Greeting types at the cursor.
greeting.default = Hello from the Showcase extension!
case.type = choice
case.title = Change case to
case.description = What Change Case of Selection does.
case.options = upper lower title reverse
case.default = upper
brackets.type = choice
brackets.title = Brackets
brackets.options = () [] {} <>
brackets.default = ()
live_marks.type = bool
live_marks.title = Mark as you type
live_marks.description = TODO, FIXME, NOTE and IDEA get marks in every open file, updated on each change.
live_marks.default = yes
status_words.type = bool
status_words.title = Word count in the status bar
status_words.default = yes
tab_width.type = int
tab_width.title = Tab width
tab_width.description = What Use the Showcase Tab Width sets for the current file.
tab_width.min = 1
tab_width.max = 16
tab_width.default = 2

[command-options]
tour.icon = spark
greet.icon = edit
stats.icon = info

[keys]
# a chord: ctrl+k then ctrl+g
ctrl+k ctrl+g = greet when editorFocus && !editorReadonly

[menu.editor]
greet.command = greet
greet.group = 5_showcase
wrap.command = wrap
wrap.group = 5_showcase
wrap.when = editorHasSelection

[menu.editor_title]
tour.command = tour

[menu.explorer]
readme.command = readme
readme.when = explorerResourceIsRoot

[status]
tour.text = $(spark) Showcase
tour.tooltip = The Showcase tour: everything an extension can do
tour.command = tour
tour.align = right
tour.priority = 10

[context]
mode = tour

[language.Showcase_Script]
# a manifest can set language keys for a grammar too (here its own)
indent_middle = else otherwise

[subscribe]
opened = *
changed = *
cursor = *
selection = *
edits = *
hover = *

[needs]
documents = write
project = read
terminal = yes
